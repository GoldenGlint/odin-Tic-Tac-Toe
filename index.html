<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Tic-Tac-Toe</title>
</head>
<body>
    <div class="container">
        <h1 class="title">Tic-Tac-Toe</h1>
        <div class="board">
            <div id="one" class="digit-container">
                <button id="one-digit" class="digit-button">1</button>

            </div>
            <div id="two" class="digit-container">
                <button id="two-digit" class="digit-button">2</button>

            </div>
            <div id="three" class="digit-container">
                <button id="three-digit" class="digit-button">3</button>
            </div>
            <div id="four" class="digit-container">
                <button id="four-digit" class="digit-button">4</button>

            </div>
            <div id="five" class="digit-container">
                <button id="five-digit" class="digit-button">5</button>

            </div>
            <div id="six" class="digit-container">
                <button id="six-digit" class="digit-button">6</button>

            </div>
            <div id="seven" class="digit-container">
                <button id="seven-digit" class="digit-button">7</button>

            </div>
            <div id="eight" class="digit-container">
                <button id="eight-digit" class="digit-button">8</button>

            </div>
            <div id="nine" class="digit-container">
                <button id="nine-digit" class="digit-button">9</button>

            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
