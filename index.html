<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Tic-Tac-Toe</title>
</head>
<body>
    <div class="container">

        <dialog id="initial-screen">
            <h1>Enter Player Names</h1>
            <input type="text" id="player-one-name" placeholder="Player One" />
            <input type="text" id="player-two-name" placeholder="Player Two" />
            <button id="start-game">Start Game</button>
        </dialog>

        <dialog id="winning-screen">
            <h1 class="winners-message"></h1>
            <button id="restart">Restart Game</button>
        </dialog>
        <div class="word-container">
            <h1 class="title">Tic-Tac-Toe</h1>
            <h1 class="turn">Player 1's Turn</h1>
        </div>
        
        <div class="board">
            <div id="one" class="digit-container">
                <button id="one-digit" class="digit-button"></button>

            </div>
            <div id="two" class="digit-container">
                <button id="two-digit" class="digit-button"></button>

            </div>
            <div id="three" class="digit-container">
                <button id="three-digit" class="digit-button"></button>
            </div>
            <div id="four" class="digit-container">
                <button id="four-digit" class="digit-button"></button>

            </div>
            <div id="five" class="digit-container">
                <button id="five-digit" class="digit-button"></button>

            </div>
            <div id="six" class="digit-container">
                <button id="six-digit" class="digit-button"></button>

            </div>
            <div id="seven" class="digit-container">
                <button id="seven-digit" class="digit-button"></button>

            </div>
            <div id="eight" class="digit-container">
                <button id="eight-digit" class="digit-button"></button>

            </div>
            <div id="nine" class="digit-container">
                <button id="nine-digit" class="digit-button"></button>

            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
